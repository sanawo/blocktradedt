<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="white"/>
  
  <!-- Central Chip/Platform (Bottom) -->
  <rect x="60" y="140" width="80" height="40" fill="none" stroke="#003366" stroke-width="3" rx="4"/>
  <rect x="70" y="150" width="60" height="20" fill="none" stroke="#003366" stroke-width="2" rx="2"/>
  
  <!-- Circuit lines from chip -->
  <line x1="60" y1="160" x2="40" y2="160" stroke="#003366" stroke-width="2"/>
  <circle cx="35" cy="160" r="3" fill="#003366"/>
  <line x1="140" y1="160" x2="160" y2="160" stroke="#003366" stroke-width="2"/>
  <circle cx="165" cy="160" r="3" fill="#003366"/>
  <line x1="100" y1="140" x2="100" y2="120" stroke="#003366" stroke-width="2"/>
  <circle cx="100" cy="115" r="3" fill="#003366"/>
  <line x1="100" y1="180" x2="100" y2="190" stroke="#003366" stroke-width="2"/>
  <circle cx="100" cy="193" r="3" fill="#003366"/>
  
  <!-- Bar Chart (Rising from chip) -->
  <rect x="75" y="120" width="12" height="20" fill="none" stroke="#003366" stroke-width="2"/>
  <rect x="75" y="130" width="12" height="10" fill="#003366" opacity="0.3"/>
  
  <rect x="92" y="110" width="12" height="30" fill="none" stroke="#003366" stroke-width="2"/>
  <rect x="92" y="125" width="12" height="15" fill="#003366" opacity="0.3"/>
  
  <rect x="109" y="100" width="12" height="40" fill="none" stroke="#003366" stroke-width="2"/>
  <rect x="109" y="115" width="12" height="25" fill="#003366" opacity="0.3"/>
  
  <rect x="126" y="90" width="12" height="50" fill="none" stroke="#003366" stroke-width="2"/>
  <rect x="126" y="105" width="12" height="35" fill="#003366" opacity="0.3"/>
  
  <!-- Line Graph (Above bar chart) -->
  <polyline points="70,135 80,125 90,115 100,105 110,100 120,95 130,90" 
            fill="none" stroke="#003366" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="70" cy="135" r="3" fill="#003366"/>
  <circle cx="80" cy="125" r="3" fill="#003366"/>
  <circle cx="90" cy="115" r="3" fill="#003366"/>
  <circle cx="100" cy="105" r="3" fill="#003366"/>
  <circle cx="110" cy="100" r="3" fill="#003366"/>
  <circle cx="120" cy="95" r="3" fill="#003366"/>
  <circle cx="130" cy="90" r="3" fill="#003366"/>
  
  <!-- Upward arrow at end of line -->
  <polyline points="125,85 130,90 135,85" fill="none" stroke="#003366" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Network/Star Structure (Upper Right) -->
  <circle cx="160" cy="40" r="4" fill="#003366"/>
  <circle cx="175" cy="35" r="4" fill="#003366"/>
  <circle cx="170" cy="50" r="4" fill="#003366"/>
  <circle cx="150" cy="50" r="4" fill="#003366"/>
  <circle cx="155" cy="60" r="4" fill="#003366"/>
  <circle cx="165" cy="60" r="4" fill="#003366"/>
  
  <line x1="160" y1="40" x2="175" y2="35" stroke="#003366" stroke-width="1.5"/>
  <line x1="160" y1="40" x2="170" y2="50" stroke="#003366" stroke-width="1.5"/>
  <line x1="160" y1="40" x2="150" y2="50" stroke="#003366" stroke-width="1.5"/>
  <line x1="175" y1="35" x2="170" y2="50" stroke="#003366" stroke-width="1.5"/>
  <line x1="170" y1="50" x2="165" y2="60" stroke="#003366" stroke-width="1.5"/>
  <line x1="150" y1="50" x2="155" y2="60" stroke="#003366" stroke-width="1.5"/>
  <line x1="155" y1="60" x2="165" y2="60" stroke="#003366" stroke-width="1.5"/>
  <line x1="160" y1="40" x2="155" y2="60" stroke="#003366" stroke-width="1.5"/>
  <line x1="160" y1="40" x2="165" y2="60" stroke="#003366" stroke-width="1.5"/>
</svg>

