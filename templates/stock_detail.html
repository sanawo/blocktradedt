<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ stock_name }} ({{ stock_code }}) - 股票详情</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 导航栏 */
    .navbar {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 0;
      margin-bottom: 20px;
    }

    .nav-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-link {
      color: #666;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s;
    }

    .nav-link:hover {
      color: #1890ff;
    }

    .nav-link.active {
      color: #1890ff;
      font-weight: 600;
    }

    /* 股票头部信息 */
    .stock-header {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .stock-title {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .stock-name {
      font-size: 28px;
      font-weight: 600;
      color: #333;
    }

    .stock-code {
      font-size: 18px;
      color: #999;
      font-weight: normal;
    }

    .stock-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 24px;
      margin-top: 20px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .info-label {
      font-size: 13px;
      color: #999;
    }

    .info-value {
      font-size: 20px;
      font-weight: 600;
      color: #333;
    }

    .info-value.positive {
      color: #f5222d;
    }

    .info-value.negative {
      color: #52c41a;
    }

    /* 主要数据卡片 */
    .data-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .data-card {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f0f0f0;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table tr {
      border-bottom: 1px solid #f0f0f0;
    }

    .data-table tr:last-child {
      border-bottom: none;
    }

    .data-table td {
      padding: 12px 0;
      font-size: 14px;
    }

    .data-table td:first-child {
      color: #999;
      width: 120px;
    }

    .data-table td:last-child {
      color: #333;
      font-weight: 500;
      text-align: right;
    }

    /* 交易数据表格 */
    .trading-table {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .trading-table table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .trading-table th {
      background: #fafafa;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: #333;
      border-bottom: 2px solid #e0e0e0;
    }

    .trading-table td {
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
      color: #666;
    }

    .trading-table tbody tr:hover {
      background: #fafafa;
    }

    .trading-table .positive {
      color: #f5222d;
    }

    .trading-table .negative {
      color: #52c41a;
    }

    /* 加载状态 */
    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #1890ff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .stock-info-grid {
        grid-template-columns: 1fr;
      }

      .data-section {
        grid-template-columns: 1fr;
      }

      .stock-name {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <div class="navbar">
    <div class="nav-content">
      <a href="/" class="nav-link">首页</a>
      <a href="/trends" class="nav-link">趋势图表</a>
      <a href="/report" class="nav-link">研报摘要</a>
      <a href="/stock/{{ stock_code }}" class="nav-link active">股票详情</a>
    </div>
  </div>

  <div class="container">
    <!-- 股票头部信息 -->
    <div class="stock-header" id="stockHeader">
      <div class="loading">
        <div class="spinner"></div>
        <div>加载中...</div>
      </div>
    </div>

    <!-- 主要数据 -->
    <div class="data-section" id="dataSection" style="display: none;">
      <!-- 实时行情 -->
      <div class="data-card">
        <div class="card-title">实时行情</div>
        <table class="data-table">
          <tr>
            <td>今开</td>
            <td id="openPrice">--</td>
          </tr>
          <tr>
            <td>昨收</td>
            <td id="prevClose">--</td>
          </tr>
          <tr>
            <td>最高</td>
            <td id="highPrice">--</td>
          </tr>
          <tr>
            <td>最低</td>
            <td id="lowPrice">--</td>
          </tr>
          <tr>
            <td>成交量</td>
            <td id="volume">--</td>
          </tr>
          <tr>
            <td>成交额</td>
            <td id="amount">--</td>
          </tr>
        </table>
      </div>

      <!-- 财务指标 -->
      <div class="data-card">
        <div class="card-title">财务指标</div>
        <table class="data-table">
          <tr>
            <td>总市值</td>
            <td id="totalMarketValue">--</td>
          </tr>
          <tr>
            <td>流通市值</td>
            <td id="circulatingValue">--</td>
          </tr>
          <tr>
            <td>市盈率(动)</td>
            <td id="peRatio">--</td>
          </tr>
          <tr>
            <td>市净率</td>
            <td id="pbRatio">--</td>
          </tr>
          <tr>
            <td>总股本</td>
            <td id="totalShares">--</td>
          </tr>
          <tr>
            <td>流通股</td>
            <td id="circulatingShares">--</td>
          </tr>
        </table>
      </div>
    </div>

    <!-- 大宗交易记录 -->
    <div class="trading-table" id="tradingTable" style="display: none;">
      <div class="card-title">大宗交易记录</div>
      <table>
        <thead>
          <tr>
            <th>交易日期</th>
            <th>成交价</th>
            <th>成交量(万股)</th>
            <th>折溢价比率</th>
            <th>成交金额(万元)</th>
            <th>买入营业部</th>
            <th>卖出营业部</th>
          </tr>
        </thead>
        <tbody id="tradingTableBody">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const stockCode = '{{ stock_code }}';
    
    async function loadStockData() {
      try {
        // 显示加载状态
        document.getElementById('stockHeader').innerHTML = `
          <div class="loading">
            <div class="spinner"></div>
            <div>正在加载股票数据...</div>
          </div>
        `;
        
        const response = await fetch(`/api/stock/${stockCode}`);
        const data = await response.json();
        
        if (data.success && data.data) {
          renderStockHeader(data.data);
          renderStockData(data.data);
          renderTradingRecords(data.data.trading_records || []);
          
          document.getElementById('stockHeader').style.display = 'block';
          document.getElementById('dataSection').style.display = 'grid';
          document.getElementById('tradingTable').style.display = 'block';
        } else {
          showError(data.error || data.message || '加载失败');
        }
      } catch (error) {
        console.error('加载股票数据失败:', error);
        showError('网络错误，请稍后重试');
      }
    }

    function renderStockHeader(data) {
      const header = document.getElementById('stockHeader');
      const change = data.change || 0;
      const changePercent = data.change_percent || 0;
      const changeClass = change >= 0 ? 'positive' : 'negative';
      const changeSign = change >= 0 ? '+' : '';

      header.innerHTML = `
        <div class="stock-title">
          <div>
            <span class="stock-name">${data.name || '--'}</span>
            <span class="stock-code">(${stockCode})</span>
          </div>
        </div>
        <div class="stock-info-grid">
          <div class="info-item">
            <span class="info-label">最新价</span>
            <span class="info-value ${changeClass}">${data.price ? data.price.toFixed(2) : '--'}</span>
          </div>
          <div class="info-item">
            <span class="info-label">涨跌</span>
            <span class="info-value ${changeClass}">${changeSign}${change.toFixed(2)}</span>
          </div>
          <div class="info-item">
            <span class="info-label">涨跌幅</span>
            <span class="info-value ${changeClass}">${changeSign}${changePercent.toFixed(2)}%</span>
          </div>
          <div class="info-item">
            <span class="info-label">换手率</span>
            <span class="info-value">${data.turnover_rate ? data.turnover_rate.toFixed(2) + '%' : '--'}</span>
          </div>
        </div>
      `;
    }

    function renderStockData(data) {
      // 实时行情
      document.getElementById('openPrice').textContent = data.open_price ? data.open_price.toFixed(2) : '--';
      document.getElementById('prevClose').textContent = data.prev_close ? data.prev_close.toFixed(2) : '--';
      document.getElementById('highPrice').textContent = data.high_price ? data.high_price.toFixed(2) : '--';
      document.getElementById('lowPrice').textContent = data.low_price ? data.low_price.toFixed(2) : '--';
      document.getElementById('volume').textContent = data.volume ? formatNumber(data.volume) + ' 手' : '--';
      document.getElementById('amount').textContent = data.amount ? formatAmount(data.amount) : '--';

      // 财务指标
      document.getElementById('totalMarketValue').textContent = data.total_market_value ? formatAmount(data.total_market_value) : '--';
      document.getElementById('circulatingValue').textContent = data.circulating_value ? formatAmount(data.circulating_value) : '--';
      document.getElementById('peRatio').textContent = data.pe_ratio ? data.pe_ratio.toFixed(2) : '--';
      document.getElementById('pbRatio').textContent = data.pb_ratio ? data.pb_ratio.toFixed(2) : '--';
      document.getElementById('totalShares').textContent = data.total_shares ? formatNumber(data.total_shares) + ' 万股' : '--';
      document.getElementById('circulatingShares').textContent = data.circulating_shares ? formatNumber(data.circulating_shares) + ' 万股' : '--';
    }

    function renderTradingRecords(records) {
      const tbody = document.getElementById('tradingTableBody');
      if (!records || records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #999; padding: 40px;">暂无大宗交易记录</td></tr>';
        return;
      }

      tbody.innerHTML = records.map(record => {
        const discountRate = record.discount_rate || 0;
        const discountClass = discountRate > 0 ? 'positive' : discountRate < 0 ? 'negative' : '';
        const discountSign = discountRate >= 0 ? '+' : '';

        return `
          <tr>
            <td>${record.date || '--'}</td>
            <td>${record.trade_price ? record.trade_price.toFixed(2) : '--'}</td>
            <td>${record.volume ? record.volume.toFixed(2) : '--'}</td>
            <td class="${discountClass}">${discountSign}${discountRate.toFixed(2)}%</td>
            <td>${record.amount ? record.amount.toFixed(2) : '--'}</td>
            <td title="${record.buy_broker || '--'}">${(record.buy_broker || '--').length > 20 ? (record.buy_broker || '--').substring(0, 20) + '...' : (record.buy_broker || '--')}</td>
            <td title="${record.sell_broker || '--'}">${(record.sell_broker || '--').length > 20 ? (record.sell_broker || '--').substring(0, 20) + '...' : (record.sell_broker || '--')}</td>
          </tr>
        `;
      }).join('');
    }

    function formatNumber(num) {
      if (!num) return '0';
      if (num >= 10000) {
        return (num / 10000).toFixed(2) + '万';
      }
      return num.toLocaleString();
    }

    function formatAmount(num) {
      if (!num) return '--';
      if (num >= 100000000) {
        return (num / 100000000).toFixed(2) + '亿元';
      } else if (num >= 10000) {
        return (num / 10000).toFixed(2) + '万元';
      }
      return num.toFixed(2) + '元';
    }

    function showError(message) {
      const header = document.getElementById('stockHeader');
      header.innerHTML = `
        <div style="text-align: center; padding: 40px; color: #999;">
          <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
          <div>${message}</div>
        </div>
      `;
    }

    // 页面加载时获取数据
    loadStockData();
  </script>
</body>
</html>
